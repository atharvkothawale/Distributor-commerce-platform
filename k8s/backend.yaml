apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnova-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnova-backend
  template:
    metadata:
      labels:
        app: shopnova-backend
    spec:
      containers:
        - name: backend
          image: shopnova-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres-service:5432/shopnova_db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: shopnova-backend-service
spec:
  type: ClusterIP
  selector:
    app: shopnova-backend
  ports:
    - port: 8080
      targetPort: 8080
