apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnova-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnova-frontend
  template:
    metadata:
      labels:
        app: shopnova-frontend
    spec:
      containers:
        - name: frontend
          image: shopnova-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: shopnova-frontend-service
spec:
  type: NodePort
  selector:
    app: shopnova-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
