server:
  port: 8080

spring:
  application:
    name: shopnova-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopnova_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 Hours

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Production Profile Security Settings
spring:
  config:
    activate:
      on-profile: prod,production
jwt:
  # In production, require securely supplied JWT_SECRET environment variable (fail startup if missing)
  secret: ${JWT_SECRET}

